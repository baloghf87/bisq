plugins {
    id 'bisq.application'
    id 'bisq.javafx'
    id 'bisq.gradle.app_start_plugin.AppStartPlugin'
}

application {
    mainClass = 'bisq.marketsnode.MarketsNodeMain'
}

javafx {
    modules = ['javafx.base']
}

distTar.enabled = true

dependencies {
    implementation project(':common')
    implementation project(':p2p')
    implementation project(':core')
    // OfferForJson's constructor takes bitcoinj Coin amounts (core only exposes bitcoinj as implementation).
    implementation(libs.bitcoinj) {
        exclude(module: 'bcprov-jdk15on')
        exclude(module: 'guava')
        exclude(module: 'jsr305')
        exclude(module: 'okhttp')
        exclude(module: 'okio')
        exclude(module: 'slf4j-api')
    }
    annotationProcessor libs.lombok
    compileOnly libs.lombok
    implementation libs.slf4j.api
    implementation(libs.google.guice) {
        exclude(module: 'guava')
    }
}
